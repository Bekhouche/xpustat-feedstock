schema_version: 1

context:
  version: 0.4.0

package:
  name: xpustat
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/x/xpustat/xpustat-${{ version }}.tar.gz
  sha256: 1b94ea0561e3c187730615f1d511f408c3f6261d99088ac729557c890bb69f64

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - xpustat = xpustat.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61
  run:
    - python >=${{ python_min }}
    - psutil >=5.9

tests:
  - python:
      imports:
        - xpustat
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - xpustat --version

about:
  homepage: https://github.com/Bekhouche/xpustat
  license: MIT
  license_file: LICENSE
  summary: A unified stat tool for NVIDIA, AMD, Intel, Huawei, Hygon, Cambricon, Moore Threads, Apple Silicon, AWS Neuron, Google TPU and Tenstorrent accelerators
  repository: https://github.com/Bekhouche/xpustat
  documentation: https://github.com/Bekhouche/xpustat/tree/main/docs

extra:
  recipe-maintainers:
    - Bekhouche
